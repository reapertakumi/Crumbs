services:
  crumbs:
    # Ready-made image, built by GitHub Actions for the Pi (arm64) and x86.
    # Update with:  docker compose pull && docker compose up -d
    image: ghcr.io/reapertakumi/crumbs:latest
    # To compile on the Pi instead, comment out the line above and uncomment:
    # build: .
    container_name: crumbs
    restart: unless-stopped
    ports:
      - "9099:9099"   # http://
      - "9443:9443"   # https:// (self-signed unless you give your own certificate)
    volumes:
      # Database (encrypted), thumbnails, photos, backups and the HTTPS certificate live here.
      - ./data:/data
      # Use the Pi's time zone, so the nightly backup runs at 3:00 your time.
      - /etc/localtime:/etc/localtime:ro
    environment:
      # All optional; set them in a file called .env next to this one (see .env.example).
      CRUMBS_DB_KEY: ${CRUMBS_DB_KEY:-}     # empty = unlock in the browser after each start
      TLS_HOSTS: ${TLS_HOSTS:-}             # names/IPs for the self-signed certificate
      HTTP_REDIRECT: ${HTTP_REDIRECT:-0}    # 1 = send http:// visitors to https://
      HTTPS_PUBLIC_PORT: ${HTTPS_PUBLIC_PORT:-9443}
    deploy:
      resources:
        limits:
          memory: 128M
