<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Crumbs</title>
  <style>
    .c { fill: #000 }
    .h { fill: #fff }
    @media (prefers-color-scheme: dark) {
      .c { fill: #fff }
      .h { fill: #000 }
    }
  </style>
  <defs>
    <mask id="bite">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="50" cy="13" r="9" fill="#000"/>
      <circle cx="57" cy="25" r="6" fill="#000"/>
      <circle cx="40" cy="6" r="6" fill="#000"/>
    </mask>
  </defs>
  <!-- the cookie, with a bite taken out -->
  <circle class="c" cx="29" cy="33" r="24" mask="url(#bite)"/>
  <!-- chocolate chips -->
  <g class="h">
    <circle cx="20" cy="24" r="3.4"/>
    <circle cx="33" cy="41" r="3.8"/>
    <circle cx="18" cy="42" r="2.6"/>
    <circle cx="37" cy="26" r="2.5"/>
    <circle cx="27" cy="33" r="1.9"/>
  </g>
  <!-- the crumbs -->
  <g class="c">
    <rect x="52" y="39" width="5.5" height="5.5" rx="1.3" transform="rotate(22 54.75 41.75)"/>
    <rect x="56" y="50" width="4.2" height="4.2" rx="1" transform="rotate(-18 58.1 52.1)"/>
    <rect x="47.5" y="55" width="3.2" height="3.2" rx=".8" transform="rotate(35 49.1 56.6)"/>
  </g>
</svg>
